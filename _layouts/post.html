---
layout: default
---
<article class="post-page">
  <a class="back-link" href="{{ '/blog/' | relative_url }}" data-back-link>&larr; Back to benchmark blog</a>
  <p class="post-kicker">{{ page.date | date: "%d %B %Y" }}</p>
  {% include topic-chips.html topics=page.topics class="post-heading-chips" %}
  <h1>{{ page.title }}</h1>
  {% if page.summary %}
    <p class="lede">{{ page.summary }}</p>
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
</article>

<script>
  (() => {
    const labels = {
      {% for topic in site.data.topics %}{{ topic.id | jsonify }}: {{ topic.back_label | jsonify }}{% unless forloop.last %},{% endunless %}
      {% endfor %}
    };
    const params = new URLSearchParams(window.location.search);
    const topic = (params.get("topic") || "").toLowerCase();
    const backLink = document.querySelector("[data-back-link]");

    if (backLink && Object.hasOwn(labels, topic)) {
      backLink.href = "{{ '/blog/' | relative_url }}?topic=" + encodeURIComponent(topic);
      backLink.textContent = "\u2190 Back to " + labels[topic];
    }
  })();
</script>
